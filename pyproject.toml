[project]
name = "agentic-workflows-workshop"
version = "1.0.0"
description = "Hands-on labs: from a single tool-using agent to a governed multi-agent platform (LangGraph, PostgreSQL/pgvector)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
# install the provider(s) you use, e.g. pip install -e ".[openai]"
openai = ["langchain-openai>=1.0"]
anthropic = ["langchain-anthropic>=1.0"]
azure = ["langchain-openai>=1.0"]
bedrock = ["langchain-aws>=1.0"]
google = ["langchain-google-genai>=2.0"]
ollama = ["langchain-ollama>=1.0"]
all = ["langchain-openai>=1.0", "langchain-anthropic>=1.0"]
dev = ["pytest>=8", "ruff>=0.6", "langgraph-cli[inmem]>=0.3", "grandalf>=0.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["workshop*", "part1_single_agent*", "part2_multi_agent*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"
