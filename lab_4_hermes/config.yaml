# Hermes Agent settings for Lab 4. `make hermes` copies this file into Hermes's
# home folder (HERMES_HOME) every time it starts, so edit it HERE, not in the
# dashboard's Config page (those changes are replaced on the next start).

# The model. `make hermes` fills in the two ${...} values from your .env:
#   BIFROST_API_KEY set          -> provider bifrost (the providers: block below),
#                                   model bedrock/global.anthropic.claude-haiku-4-5-20251001-v1:0
#   else AWS_BEARER_TOKEN_BEDROCK -> provider bedrock, model global.anthropic.claude-sonnet-4-6
#   else OPENROUTER_API_KEY set  -> provider openrouter, model openai/gpt-6-luna
#   else OPENAI_API_KEY set      -> provider openai-api (straight to OpenAI), model gpt-6-luna
# To choose yourself, set HERMES_PROVIDER (bifrost, bedrock, openrouter or openai) and/or
# HERMES_MODEL in .env. These are the same keys Labs 1-3 use.
model:
  default: ${HERMES_MODEL}
  provider: ${HERMES_PROVIDER}

# Our Bifrost gateway, as a custom OpenAI-compatible provider. The address comes
# from BIFROST_URL in .env and the key from BIFROST_API_KEY.
providers:
  bifrost:
    name: Bifrost
    base_url: ${HERMES_BIFROST_BASE_URL}
    key_env: BIFROST_API_KEY
    transport: chat_completions

# Our citizen-services tools, served by `python -m workshop.mcp_server`
# (make hermes starts it). Hermes names them mcp__citizen_services__<tool>.
mcp_servers:
  citizen_services:
    url: http://127.0.0.1:8765/mcp
    tools:
      # The ONLY control on what Hermes may do with our systems.
      # submit_application is left out on purpose (Lab 4, step 5).
      include:
        - list_schemes
        - get_scheme_details
        - search_knowledge_base
        - check_eligibility
        - calculator
        - get_appointment_slots
        - book_appointment
        - check_application_status
        - get_today

# Shell commands and file edits run inside the workshop container, starting in
# the repo folder. Nothing outside the repo on your laptop is reachable.
terminal:
  backend: local
  cwd: /app

# Ask before risky shell commands ("smart" lets safe, read-only ones through).
approvals:
  mode: smart
